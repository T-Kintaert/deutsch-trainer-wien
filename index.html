<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deutsch-Trainer Wien</title>
<meta name="description" content="Deutsch üben: gezielt die Fehler vermeiden, die für Sprecherinnen und Sprecher deiner Muttersprache typisch sind.">
<style>
:root{--bg:#f7f4ee;--card:#fff;--ink:#1f2328;--mute:#667085;--line:#e4dfd5;--acc:#b3261e;--acc-ink:#fff;--ok:#1a7f4b;--okbg:#e3f5ea;--bad:#b42318;--badbg:#fde8e6;--m:#1d5fd1;--f:#c0263a;--n:#1a8a4a;--chip:#f0ece3;--l2:#d96a00;--l2i:#fff;--sel:#1d5a9e;--sel-ink:#fff}
[data-theme=dark]{--bg:#15171a;--card:#1f2226;--ink:#eceef1;--mute:#9aa4b2;--line:#33383f;--acc:#ef6b62;--acc-ink:#1a1010;--ok:#5fd39a;--okbg:#173527;--bad:#ff8a80;--badbg:#3d1c1a;--m:#7fb0ff;--f:#ff8b9a;--n:#6fdc9c;--chip:#2a2e34;--l2:#ffa040;--l2i:#1f1300;--sel:#8ab4ff;--sel-ink:#0d1b30}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Arabic",sans-serif}
#app{max-width:680px;margin:0 auto;padding:12px 16px 72px}
h1{font-size:1.7rem;line-height:1.2;margin:.2em 0}
h2{font-size:1.25rem;margin:1.2em 0 .5em}
p{margin:.5em 0}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px}
button:focus-visible,input:focus-visible{outline:3px solid var(--m);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
.btn{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600;padding:12px 20px}
.btn2{font-weight:600}
.link{border:0;background:none;color:var(--mute);padding:6px 4px;text-decoration:underline}
.back{border:0;background:none;padding:6px 4px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.arr{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--sel);color:var(--sel-ink);flex:none}
.arr svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
[dir=rtl] .arr{transform:scaleX(-1)}
.ib{border-radius:99px;padding:6px 9px;line-height:1.1;font-size:1.05rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.mute{color:var(--mute)}
.small{font-size:.86rem}
.center{text-align:center}
.de{font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.grid.sm{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.langbtn{font-size:1.1rem;font-weight:600;padding:16px;text-align:center;-webkit-touch-callout:none;user-select:none}
.grid.sm .langbtn{font-size:1rem;padding:11px;font-weight:500}
.langbtn{transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease,background-color .15s ease}
.langbtn:focus-visible{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc)}
@media (hover:hover){.langbtn:hover{transform:translateY(-3px);border-color:var(--acc);box-shadow:0 8px 18px rgba(0,0,0,.16),inset 0 -3px 0 var(--acc)}}
.langbtn:active{transform:translateY(0) scale(.98)}
@media (prefers-reduced-motion:reduce){.langbtn{transition:none}.langbtn:hover{transform:none}}
.ib svg{width:1.05em;height:1.05em;vertical-align:-.15em;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hint{border-inline-start:3px solid var(--acc);padding:6px 12px;margin:18px 0}
.mod{display:flex;gap:12px;align-items:center;width:100%;text-align:start;margin:8px 0;padding:12px 14px}
.mod .ic{font-size:1.5rem;width:36px;text-align:center;flex:none}
.mod .tt{flex:1;min-width:0}
.mod .tt b{display:block}
.badge{display:inline-block;font-size:.72rem;font-weight:700;background:var(--acc);color:var(--acc-ink);border-radius:99px;padding:2px 8px;margin-inline-start:6px;vertical-align:middle}
.pct{font-weight:700;color:var(--ink);flex:none;font-size:.9rem}
/* Liniennetz: Trainingsplan als Linie mit Stationen */
.linecard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 0 6px;margin:14px 0;--lc:var(--acc);--li:var(--acc-ink)}
.linecard.l2{--lc:var(--l2);--li:var(--l2i)}
.lhead{display:flex;align-items:center;gap:10px;padding:2px 14px;width:100%;min-height:40px;background:none;border:0;border-radius:0;text-align:start;font:inherit;color:inherit;margin:0}
.lhead h2{margin:0;font-size:1rem;flex:1}
.lbadge{min-width:30px;height:26px;padding:0 8px;border-radius:6px;background:var(--lc);color:var(--li);font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
.chev{flex:none;color:var(--mute);font-size:.95rem}
.stations{position:relative;margin-top:4px}
.stations::before{content:"";position:absolute;inset-inline-start:24px;top:32px;bottom:32px;width:4px;background:var(--lc);border-radius:2px}
.mod.st{position:relative;gap:12px;min-height:64px;margin:0;padding:8px 14px 8px 15px;border:0;border-radius:0;background:none;box-shadow:none}
.mod.st:hover,.mod.st:focus-visible{background:var(--chip)}
.dot{width:22px;height:22px;border-radius:50%;box-sizing:border-box;border:4px solid var(--lc);background:var(--card);flex:none;display:flex;align-items:center;justify-content:center;position:relative}
.dot.part{background:radial-gradient(circle,var(--lc) 0 4px,var(--card) 5px)}
.dot.done{background:var(--lc)}
.dot svg{width:13px;height:13px;fill:none;stroke:var(--li);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.mi{width:40px;height:40px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--c);background:var(--cb)}
.mi svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.c0{--c:#1d5fbf;--cb:#e4edfb}.c1{--c:#7a3ea8;--cb:#f0e8f7}.c2{--c:#0e7490;--cb:#dff1f5}.c3{--c:#b45309;--cb:#fbeedd}.c4{--c:#0f7b4f;--cb:#e1f3eb}.c5{--c:#9d174d;--cb:#f9e6ef}
[data-theme=dark] .c0{--c:#8ab4ff;--cb:#1c2a44}[data-theme=dark] .c1{--c:#cfa3f0;--cb:#2f2140}[data-theme=dark] .c2{--c:#6fd3e8;--cb:#16323a}[data-theme=dark] .c3{--c:#f3b267;--cb:#3a2a16}[data-theme=dark] .c4{--c:#6fd6a3;--cb:#16352a}[data-theme=dark] .c5{--c:#f39ac0;--cb:#3d1c2c}
.l2row{padding:6px 14px 4px 15px}
/* Info-Fenster */
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:12px}
@media (min-width:560px){.ovl{align-items:center}}
.modal{background:var(--card);color:var(--ink);border-radius:18px;max-width:480px;width:100%;max-height:calc(100vh - 24px);overflow:auto;padding:18px 18px 16px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal h2{margin:0;font-size:1.2rem}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.note{background:var(--chip);border-radius:12px;padding:10px 12px;margin:10px 0}
.mfoot{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pills button{border-radius:99px;padding:6px 14px}
.pills button.on{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.lvl{align-items:center}.lvl .lab{font-weight:600;margin-inline-end:4px}.lvl button{min-width:52px;font-weight:600}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 16px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.prompt{font-size:1.2rem;margin:8px 0 14px}
.sent{font-size:1.3rem;font-weight:600;direction:ltr;text-align:left;margin:10px 0}
.gap{display:inline-block;min-width:3em;border-bottom:3px solid var(--acc);text-align:center;color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px;direction:ltr;min-height:52px;padding:8px;border-radius:12px}
.chips.ans{background:var(--chip);border:2px dashed var(--line);margin-bottom:12px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:600;font-size:1.05rem}
.chip.fix{background:transparent;border-style:dashed;cursor:default}
.opts{display:grid;gap:10px;margin:14px 0}
.opts.h{grid-template-columns:repeat(3,1fr)}
.opts.h2{grid-template-columns:1fr 1fr}
.opt{font-size:1.1rem;font-weight:600;padding:14px;direction:ltr;text-align:center}
.opt.l1{direction:inherit}
.opt.good{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.g-m{color:var(--m)}.g-f{color:var(--f)}.g-n{color:var(--n)}
.opt.g-m{border-color:var(--m)}.opt.g-f{border-color:var(--f)}.opt.g-n{border-color:var(--n)}
.fb{border-radius:14px;padding:14px;margin:14px 0}
.fb.good{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.fb .sent{font-size:1.15rem;margin:6px 0}
.spk{border-radius:99px;padding:6px 10px;line-height:1}
.err{display:grid;gap:2px;padding:10px 0;border-top:1px solid var(--line)}
.err .x{color:var(--bad);text-decoration:line-through;direction:ltr;text-align:left}
.err .v{color:var(--ok);font-weight:700;direction:ltr;text-align:left}
details.rule{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:10px 0}
details.rule summary{cursor:pointer;font-weight:600}
input[type=search],input[type=text]{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.vrow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.vrow .w{flex:1;min-width:0;border:0;background:none;padding:0;text-align:start;border-radius:6px}
.vrow .w .d{direction:ltr;display:block;text-align:start;font-weight:600}
[dir=rtl] .vrow .w .d{text-align:right}
.vex{display:block;margin-top:6px;padding:8px 10px;background:var(--chip);border-radius:10px;font-size:.92rem}
.vex i{display:block;direction:ltr;text-align:left;font-style:normal;font-weight:600}
.big{font-size:3rem;margin:.2em 0}
.logo{width:1.5em;height:1.5em;vertical-align:-.35em;color:var(--ink)}
.logo.xl{width:76px;height:76px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;min-height:44px}
.endp{align-self:center;font-weight:700;font-size:1.2rem;margin-inline-start:-4px}
.top2{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;min-height:36px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;max-width:90vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.on{opacity:1}
@media (max-width:420px){.opts.h{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<script src="data/core.js"></script>
<script src="data/freq.js"></script>
<script src="lang/de.js"></script>
<script>
"use strict";
/* ============ EINSTELLUNGEN ============
   Statistik: GoatCounter-Code eintragen (z. B. "deutschtrainer" für
   https://deutschtrainer.goatcounter.com). Leer = keine Statistik.
   Feedback: entweder eine E-Mail-Adresse oder die Adresse eines Formulars
   eintragen. In der Formular-Adresse wird {ref} durch Version, Sprache und
   Satz-Kennung ersetzt. Beides leer = kein Feedback-Knopf. */
const STATS = { goatcounter: "" };
const FEEDBACK = { email: "", url: "" };
/* ======================================= */

const CORE = window.DT_CORE, LANGS = window.DT_LANG;
const DE = LANGS.de, KEY = "dt_wien_v1";
const $ = s => document.querySelector(s);
const app = $("#app");
const LOGO = '<svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="24" cy="21" r="15"/><path d="M24 6v30M9 21h30M13.4 10.4l21.2 21.2M34.6 10.4L13.4 31.6M24 21l-9 24M24 21l9 24M11 45h26"/></g><g fill="var(--acc)"><rect x="21" y="2.5" width="6" height="6" rx="1.5"/><rect x="21" y="33.5" width="6" height="6" rx="1.5"/><rect x="5.5" y="18" width="6" height="6" rx="1.5"/><rect x="36.5" y="18" width="6" height="6" rx="1.5"/><rect x="10" y="7" width="6" height="6" rx="1.5"/><rect x="32" y="7" width="6" height="6" rx="1.5"/><rect x="10" y="29" width="6" height="6" rx="1.5"/><rect x="32" y="29" width="6" height="6" rx="1.5"/></g></svg>';
let S = { lang: null, ui: null, level: 1, profile: null, cname: "", prog: {}, miss: {}, seen: {}, dark: false };
let L = DE, ses = null, view = "lang", ask = null;
let vstate = { tab: "list", cat: "all", q: "", sort: "freq", open: null, quiz: null };
const EX = {};

function load() { try { const r = JSON.parse(localStorage.getItem(KEY)); if (r && typeof r === "object") S = Object.assign(S, r); } catch (e) {} if (!S.miss) S.miss = {}; if (!S.seen) S.seen = {};
    /* alte Speicherform (Fortschritt ohne Sprache) der aktuellen Sprache zuordnen */
    if (S.prog && Object.keys(S.prog).some(k => S.prog[k] && typeof S.prog[k].best === "number")) { const old = S.prog; S.prog = {}; S.prog[S.lang || "_"] = old; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
/* {…} markiert deutschen Text innerhalb einer Erklärung */
function fmt(s) { return esc(s || "").replace(/\{([^}]*)\}/g, '<span class="de" dir="ltr" lang="de">$1</span>'); }
function t(k) { return (L.ui && L.ui[k]) || DE.ui[k] || k; }
function modText(id) { return (L.mod && L.mod[id]) || DE.mod[id] || { t: id, r: "" }; }
function tr(id) { return L !== DE && L.s ? L.s[id] : null; }
function vtr(w) { return L !== DE && L.v ? L.v[w] : null; }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function art(g) { return { m: "der", f: "die", n: "das", pl: "die" }[g] || ""; }
function native() { return !!S.lang && S.lang === S.ui; }
function langMeta(id) { return CORE.langs.find(x => x.id === id) || CORE.presets.find(x => x.id === id); }
let toastT = 0;
function toast(msg) { const el = $("#toast"); el.textContent = msg; el.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("on"), 2600); }

/* ---------- Statistik (anonym, nur wenn oben eingetragen) ---------- */
function statInit() {
  if (!STATS.goatcounter) return;
  const s = document.createElement("script");
  s.async = true; s.src = "https://gc.zgo.at/count.js";
  s.dataset.goatcounter = "https://" + STATS.goatcounter + ".goatcounter.com/count";
  document.head.appendChild(s);
}
function stat(name, n) {
  if (!STATS.goatcounter) return;
  n = n === undefined ? 6 : n;
  if (window.goatcounter && window.goatcounter.count) { try { window.goatcounter.count({ path: name, title: name, event: true }); } catch (e) {} }
  else if (n > 0) setTimeout(() => stat(name, n - 1), 1500);
}
function statLang() { return S.lang === "custom" ? "andere" : S.lang; }

/* ---------- Feedback ---------- */
function canFeedback() { return !!(FEEDBACK.email || FEEDBACK.url); }
function feedback(ref) {
  const info = "v" + CORE.version + " | " + (S.lang || "-") + "/" + (S.ui || "-") + (ref ? " | " + ref : "");
  if (FEEDBACK.url) window.open(FEEDBACK.url.replace("{ref}", encodeURIComponent(info)), "_blank", "noopener");
  else if (FEEDBACK.email) location.href = "mailto:" + FEEDBACK.email + "?subject=" + encodeURIComponent("Deutsch-Trainer Wien: Feedback") + "&body=" + encodeURIComponent("[" + info + "]\n\n");
  stat("feedback");
}

/* ---------- Audio ---------- */
let voice = null;
function pickVoice() {
  if (!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices().filter(v => /^de([-_]|$)/i.test(v.lang));
  voice = vs.find(v => /de[-_]AT/i.test(v.lang)) || vs.find(v => /de[-_]DE/i.test(v.lang)) || vs[0] || null;
}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function canSpeak() { return "speechSynthesis" in window; }
function speak(txt) {
  if (!canSpeak()) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(txt.replace(/–/g, ""));
    u.lang = voice ? voice.lang : "de-AT"; if (voice) u.voice = voice; u.rate = 0.9;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function spk(txt) { return canSpeak() ? `<button class="spk" data-say="${esc(txt)}" aria-label="${esc(t("listen"))}" title="${esc(t("listen"))}">🔊</button>` : ""; }

/* ---------- Sprachdateien laden ---------- */
function loadLang(id) {
  return new Promise((res, rej) => {
    if (LANGS[id]) return res(LANGS[id]);
    const s = document.createElement("script");
    s.src = "lang/" + id + ".js?v=" + CORE.version;
    s.onload = () => LANGS[id] ? res(LANGS[id]) : rej(new Error("lang"));
    s.onerror = () => rej(new Error("lang"));
    document.head.appendChild(s);
  });
}
function applyLang() {
  const meta = CORE.langs.find(x => x.id === S.ui);
  document.documentElement.lang = S.ui || "de";
  app.dir = meta && meta.rtl && view !== "lang" ? "rtl" : "ltr";
  document.documentElement.dataset.theme = S.dark ? "dark" : "light";
}
function hasFF() { return native() && L.ff && L.ff.length > 0; }
function weights() {
  const w = S.lang === "custom" ? (S.profile || {}) : (CORE.profiles[S.lang] || {});
  const out = {};
  CORE.modules.forEach(m => { let x = w[m.id]; if (x === undefined) x = 1; if (m.core && x < 2) x = 2; if (m.id === "ff") x = hasFF() ? 3 : 0; out[m.id] = x; });
  return out;
}
function visibleMods() { return CORE.modules.filter(m => !(m.id === "laute" && !canSpeak()) && !(m.id === "ff" && !hasFF())); }

/* ---------- Übungen zusammenstellen ---------- */
function typeOf(it) { return it.c ? "puzzle" : it.t ? "gap" : "pick"; }
function missKey(it) { return it.id || (it.v ? "g:" + it.v.d : it.f ? "f:" + it.f.de : null); }
function byMiss(a, key) { return a.map((x, i) => [x, S.miss[key(x)] ? 0 : 1, i]).sort((p, q) => p[1] - q[1] || p[2] - q[2]).map(p => p[0]); }
function itemsFor(id, max) {
  max = max || 10;
  if (id === "genus") {
    const pool = shuffle(CORE.vocab.filter(v => "mfn".includes(v.g || "x") && v.l <= S.level));
    return shuffle(byMiss(pool, v => "g:" + v.d).slice(0, max)).map(v => ({ type: "genus", mod: id, v }));
  }
  if (id === "laute") {
    return shuffle(CORE.pairs).slice(0, max).map(p => ({ type: "laute", mod: id, pair: p, target: Math.random() < 0.5 ? 0 : 1 }));
  }
  if (id === "ff") {
    return shuffle(byMiss(shuffle(L.ff || []), f => "f:" + f.de).slice(0, max)).map(f => ({ type: "ff", mod: id, f }));
  }
  /* Auswahl: zuerst bis zur Hälfte früher falsch gelöste Sätze, dann die am seltensten gezeigten. So kommen alle Sätze der Reihe nach dran. */
  let pool = shuffle(CORE.items[id].filter(x => x.l <= S.level)).sort((a, b) => (S.seen[a.id] || 0) - (S.seen[b.id] || 0));
  const missed = pool.filter(x => S.miss[x.id]).slice(0, Math.ceil(max / 2));
  pool = missed.concat(pool.filter(x => missed.indexOf(x) < 0).slice(0, max - missed.length));
  pool.forEach(x => { S.seen[x.id] = (S.seen[x.id] || 0) + 1; }); save();
  return shuffle(pool).map(x => Object.assign({ type: typeOf(x), mod: id }, x));
}
function mixedItems(kind) {
  const w = weights(), mods = visibleMods(); let out = [];
  let min = kind === "typ" ? 3 : 1;
  if (kind === "typ" && mods.filter(m => w[m.id] >= 3).length < 4) min = 2;
  mods.forEach(m => { if (w[m.id] >= min) out = out.concat(itemsFor(m.id, kind === "typ" ? 3 : w[m.id])); });
  return shuffle(out).slice(0, 15);
}

  const cats = [["all", "∗"], ["n", t("cat_n")], ["v", t("cat_v")], ["a", t("cat_a")], ["w", t("cat_w")], ["at", "🇦🇹 " + t("cat_at")]];
  const pill = (attr, val, cur, label) => `<button ${attr}="${val}" class="${cur === val ? "on" : ""}">${label}</button>`;
  const head = topbar("home", `<b>📚 ${fmt(t("vocab"))}</b>`) + `<div class="row pills">${pill("data-vtab", "list", vstate.tab, fmt(t("vList")))}${L !== DE ? pill("data-vtab", "quiz", vstate.tab, fmt(t("vQuiz"))) : ""}</div>
  <div class="row pills" style="margin-top:10px">${cats.map(c => pill("data-vcat", c[0], vstate.cat, esc(c[1]))).join("")}</div>`;
  if (vstate.tab === "quiz" && vstate.quiz) {
    const z = vstate.quiz, v = z.q[z.i];
    if (!v) return head + `<div class="card center"><div class="big">🎉</div><p class="prompt">${fmt(t("score").replace("{n}", z.ok).replace("{m}", z.q.length))}</p><button class="btn" data-vquiz="1">${fmt(t("again"))}</button></div>`;
    const de = `${v.g ? art(v.g) + " " : ""}${v.d}`;
    return head + `<div class="card"><p class="mute small">${z.i + 1} / ${z.q.length}</p>
    <p class="sent ${"mfn".includes(v.g || "x") ? "g-" + v.g : ""}" style="text-align:center;font-size:1.6rem" lang="de">${esc(de)} ${spk(de)}</p>
    <div class="opts">${z.opts.map((o, k) => `<button class="opt l1 ${z.done ? (k === z.right ? "good" : k === z.chosen ? "bad" : "") : ""}" data-vopt="${k}" ${z.done ? "disabled" : ""}>${esc(o)}</button>`).join("")}</div>
    ${z.done ? `<button class="btn" data-vnext="1">${fmt(t("next"))}</button>` : ""}</div>`;
  }
  return head + `<div class="row pills" style="margin-top:10px">${pill("data-vsort", "freq", vstate.sort, fmt(t("sortFreq")))}${pill("data-vsort", "abc", vstate.sort, fmt(t("sortAbc")))}</div>
  <p style="margin-top:12px"><input type="search" id="vq" placeholder="${esc(t("search"))}" value="${esc(vstate.q)}"></p>
  ${vstate.tab === "quiz" ? `<p><button class="btn" data-vquiz="1">${fmt(t("start"))}</button></p>` : ""}<div id="vlist">${vocabRows()}</div>`;
}
/* ---------- Ablauf einer Übung ---------- */
function startSession(q, mod, kind) {
  if (!q.length) return;
  ses = { q, i: 0, ok: 0, mod, kind, cur() { return this.q[this.i]; } };
  prep(); stat("uebung-" + (mod || "gemischt-" + kind)); go("ex");
}
function prep() {
  const it = ses.cur();
  ses.answered = false; ses.chosen = -1; ses.right = -1; ses.sel = []; ses.lastOk = false;
  if (it.type === "puzzle") { const m = /[.!?]+$/.exec(it.c[it.c.length - 1]); ses.end = m ? m[0] : ""; ses.want = it.c.slice(1).map((c, i, a) => i === a.length - 1 && ses.end ? c.slice(0, -ses.end.length) : c);
    let p = ses.want, k = 0; do { ses.pool = shuffle(p); k++; } while (p.length > 1 && ses.pool.join("|") === p.join("|") && k < 8); }
  else if (it.type === "gap") { ses.opts = shuffle(it.o); ses.right = ses.opts.indexOf(it.o[0]); }
  else if (it.type === "pick") { ses.opts = shuffle([it.ok].concat(it.no)); ses.right = ses.opts.indexOf(it.ok); }
  else if (it.type === "genus") { ses.opts = ["m", "f", "n"]; ses.right = ses.opts.indexOf(it.v.g); }
  else if (it.type === "ff") { ses.opts = shuffle([it.f.ok, it.f.no]); ses.right = ses.opts.indexOf(it.f.ok); }
  else { ses.opts = it.pair.slice(); ses.right = it.target; }
}
function answer(ok) {
  ses.answered = true; ses.lastOk = ok; if (ok) ses.ok++;
  const k = missKey(ses.cur());
  if (k) { if (!ok) S.miss[k] = (S.miss[k] || 0) + 1; else if (S.miss[k]) { S.miss[k]--; if (S.miss[k] <= 0) delete S.miss[k]; } save(); }
  render();
  const fb = app.querySelector(".fb"); if (fb) fb.scrollIntoView({ block: "nearest", behavior: "smooth" });
}
function next() {
  ses.i++;
  if (ses.i >= ses.q.length) {
    if (ses.mod) { const pct = Math.round(ses.ok / ses.q.length * 100), p = prog()[ses.mod] || { best: 0, n: 0 }; prog()[ses.mod] = { best: Math.max(p.best, pct), n: p.n + 1 }; save(); }
    return go("done");
  }
  prep(); render(); window.scrollTo(0, 0);
}
function vquizStart() {
  const pool = vocabFiltered().filter(v => vtr(v.d));
  if (pool.length < 4) return;
  vstate.quiz = { q: shuffle(pool).slice(0, 10), i: 0, ok: 0 }; vquizPrep();
}
function vquizPrep() {
  const z = vstate.quiz, v = z.q[z.i]; z.done = false; z.chosen = -1;
  if (!v) return;
  const same = CORE.vocab.filter(x => x.d !== v.d && x.c === v.c && vtr(x.d) && vtr(x.d) !== vtr(v.d));
  z.opts = shuffle([vtr(v.d)].concat(shuffle(same).slice(0, 3).map(x => vtr(x.d)))); z.right = z.opts.indexOf(vtr(v.d));
}
async function chooseLang(id) {
  try { L = await loadLang(id); } catch (e) { L = DE; toast("Sprachdatei konnte nicht geladen werden · Language file could not be loaded"); return false; }
  return true;
}
function share() {
  const url = location.href.split("#")[0], text = t("shareText");
  if (navigator.share) { navigator.share({ title: "Deutsch-Trainer Wien", text, url }).catch(() => {}); }
  else if (navigator.clipboard) { navigator.clipboard.writeText(text + " " + url).then(() => toast("✓ " + t("copied"))).catch(() => {}); }
  stat("teilen");
}

/* ---------- Ereignisse ---------- */
let pressT = 0, pressed = false;
app.addEventListener("touchstart", ev => {
  const b = ev.target.closest("[data-tip]"); if (!b) return;
  pressed = false; clearTimeout(pressT);
  pressT = setTimeout(() => { pressed = true; toast(b.dataset.tip); }, 550);
}, { passive: true });
["touchend", "touchmove", "touchcancel"].forEach(n => app.addEventListener(n, () => clearTimeout(pressT), { passive: true }));
app.addEventListener("contextmenu", ev => { if (ev.target.closest("[data-tip]")) ev.preventDefault(); });
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && infoOpen) { infoOpen = false; render(); } });
app.addEventListener("click", async ev => {
  if (infoOpen && ev.target.classList && ev.target.classList.contains("ovl")) { infoOpen = false; return render(); }
  const b = ev.target.closest("button"); if (!b) return;
  if (pressed && b.dataset.tip) { pressed = false; return; }
  const d = b.dataset;
  if (d.say !== undefined) return speak(d.say);
  if (d.share) return share();
  if (d.full) return toggleFull();
  if (d.report !== undefined) return feedback(d.report);
  if (d.dark) { S.dark = !S.dark; save(); return render(); }
  if (d.lang) {
    if (d.lang === "custom") { ask = { ui: null, i: 0, a: {} }; return go("ask"); }
    if (!(await chooseLang(d.lang))) return;
    const isNew = S.lang !== d.lang; S.lang = d.lang; S.ui = d.lang; save();
    if (isNew) stat("neu-" + d.lang);
    return go("intro");
  }
  if (d.preset) { ask = { ui: null, preset: d.preset }; return go("ask"); }
  if (d.askui) {
    if (!(await chooseLang(d.askui))) return;
    ask.ui = d.askui; S.ui = d.askui;
    if (ask.preset) { const isNew = S.lang !== ask.preset; S.lang = ask.preset; save(); if (isNew) stat("neu-" + ask.preset); return go("home"); }
    return go("ask");
  }
  if (d.ans) { ask.a[CORE.quiz[ask.i].id] = d.ans; ask.i++; return render(); }
  if (d.askdone) {
    const prof = Object.assign({}, CORE.customBase);
    CORE.quiz.forEach(q => { prof[q.m] = ask.a[q.id] === q.w ? 3 : q.e; });
    const nm = ($("#cname").value || "").trim().slice(0, 30);
    S.lang = "custom"; S.profile = prof; S.cname = nm; save();
    const slug = nm.toLowerCase().replace(/[^a-zà-ɏ]/g, "").slice(0, 20);
    stat("neu-andere" + (slug ? "-" + slug : ""));
    return go("home");
  }
  if (d.go) {
    if (d.go === "home" && !S.lang) return go("lang");
    if (d.go === "lang" && view === "ask" && S.lang && LANGS[S.lang] ) { S.ui = S.ui; }
    return go(d.go);
  }
  if (d.level) { S.level = +d.level; save(); return render(); }
  if (d.mod) return startSession(itemsFor(d.mod), d.mod);
  if (d.mixed) return startSession(mixedItems(d.mixed), null, d.mixed);
  if (d.again) return ses.mod ? startSession(itemsFor(ses.mod), ses.mod) : startSession(mixedItems(ses.kind), null, ses.kind);
  if (d.sel !== undefined) { ses.sel.push(+d.sel); return render(); }
  if (d.unsel !== undefined) { ses.sel.splice(+d.unsel, 1); return render(); }
  if (d.check) { const it = ses.cur(); return answer(ses.sel.map(i => ses.pool[i]).join(" ") === ses.want.join(" ")); }
  if (d.opt !== undefined) { ses.chosen = +d.opt; return answer(ses.chosen === ses.right); }
  if (d.next) return next();
  if (d.vtab) { vstate.tab = d.vtab; vstate.quiz = null; return render(); }
  if (d.vcat) { vstate.cat = d.vcat; vstate.quiz = null; return render(); }
  if (d.vsort) { vstate.sort = d.vsort; return render(); }
  if (d.vex !== undefined) { vstate.open = vstate.open === d.vex ? null : d.vex; $("#vlist").innerHTML = vocabRows(); return; }
  if (d.vquiz) { vquizStart(); return render(); }
  if (d.vopt !== undefined) { const z = vstate.quiz; z.chosen = +d.vopt; z.done = true; if (z.chosen === z.right) z.ok++; return render(); }
  if (d.vnext) { vstate.quiz.i++; vquizPrep(); return render(); }
  if (d.reset) { S.prog = {}; S.miss = {}; S.seen = {}; save(); toast("✓"); infoOpen = false; return render(); }
  if (d.info) { infoOpen = true; return render(); }
  if (d.infoclose) { infoOpen = false; return render(); }
  if (d.more) { moreOpen = !moreOpen; return render(); }
});
app.addEventListener("input", ev => {
  if (ev.target.id !== "vq") return;
  vstate.q = ev.target.value; $("#vlist").innerHTML = vocabRows();
});

/* ---------- Start ---------- */
(async function init() {
  load(); statInit(); buildEx();
  if (S.lang && S.ui) {
    if (await chooseLang(S.ui)) { stat("besuch-" + statLang()); view = "home"; }
    else { view = "lang"; }
  }
  render();
})();
</script>
</body>
